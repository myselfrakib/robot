<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Robot Controller</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#141E30,#243B55);
color:white;
}

.panel{
width:380px;
padding:30px;
border-radius:26px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
box-shadow:0 25px 70px rgba(0,0,0,.6);
text-align:center;
}

h1{
margin-bottom:20px;
font-weight:600;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
margin-top:10px;
}

.btn{
height:80px;
border:none;
border-radius:20px;
font-size:26px;
background:rgba(255,255,255,.08);
color:white;
transition:.2s;
}

.btn:active{
transform:scale(.92);
background:rgba(255,255,255,.2);
}

.stop{
background:#ff4757;
}

.stop:active{
background:#ff6b81;
}

.forward{grid-column:2;}
.backward{grid-column:2;}

.speedBox{
margin-top:25px;
}

input[type=range]{
width:100%;
margin-top:10px;
}

.status{
margin-top:18px;
font-size:14px;
opacity:.85;
}

</style>

</head>

<body>

<div class="panel">

<h1>⚡ PRO ROBOT</h1>

<div class="grid">

<div></div>
<button class="btn forward"
onmousedown="move('F')"
ontouchstart="move('F')"
onmouseup="stop()"
ontouchend="stop()">⬆</button>
<div></div>

<button class="btn"
onmousedown="move('L')"
ontouchstart="move('L')"
onmouseup="stop()"
ontouchend="stop()">⬅</button>

<button class="btn stop"
onclick="stop()">STOP</button>

<button class="btn"
onmousedown="move('R')"
ontouchstart="move('R')"
onmouseup="stop()"
ontouchend="stop()">➡</button>

<div></div>
<button class="btn backward"
onmousedown="move('B')"
ontouchstart="move('B')"
onmouseup="stop()"
ontouchend="stop()">⬇</button>
<div></div>

</div>

<div class="speedBox">
Speed
<input type="range" min="80" max="255" value="150"
onchange="setSpeed(this.value)">
</div>

<div class="status" id="status">
READY
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyB3V69-7f3sIOqaKnI5qWBXVZ2puYtL-MM",
authDomain: "apna-kaam-731c9.firebaseapp.com",
databaseURL: "https://apna-kaam-731c9-default-rtdb.firebaseio.com",
projectId: "apna-kaam-731c9",
storageBucket: "apna-kaam-731c9.firebasestorage.app",
messagingSenderId: "735847647314",
appId: "1:735847647314:web:ae023a0cd2c97f5659b78b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.move = function(direction){

set(ref(db,"robot/command"),direction);

document.getElementById("status").innerText =
"Moving " + direction;

}

window.stop = function(){

set(ref(db,"robot/command"),"S");

document.getElementById("status").innerText =
"STOPPED";

}

window.setSpeed = function(value){

set(ref(db,"robot/speed"),parseInt(value));

document.getElementById("status").innerText =
"Speed: " + value;

}

</script>

</body>
</html>
