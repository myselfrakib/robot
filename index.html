<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Robot Controller</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

.container{
text-align:center;
backdrop-filter:blur(18px);
background:rgba(255,255,255,0.05);
padding:40px;
border-radius:24px;
box-shadow:0 20px 60px rgba(0,0,0,.6);
width:340px;
}

h1{
margin-bottom:25px;
font-weight:600;
letter-spacing:1px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

button{
height:75px;
border:none;
border-radius:18px;
font-size:22px;
cursor:pointer;
background:rgba(255,255,255,0.1);
color:white;
transition:.25s;
}

button:hover{
transform:scale(1.08);
background:rgba(255,255,255,0.2);
}

button:active{
transform:scale(.95);
}

.forward{grid-column:2;}
.backward{grid-column:2;}
.stop{
background:#ff4757;
}
.stop:hover{
background:#ff6b81;
}

.status{
margin-top:20px;
font-size:14px;
opacity:.8;
}

</style>

</head>

<body>

<div class="container">

<h1>🚀 Robot Control</h1>

<div class="grid">

<div></div>
<button class="forward" onclick="sendCommand('F')">⬆</button>
<div></div>

<button onclick="sendCommand('L')">⬅</button> <button class="stop" onclick="sendCommand('S')">STOP</button> <button onclick="sendCommand('R')">➡</button>

<div></div>
<button class="backward" onclick="sendCommand('B')">⬇</button>
<div></div>

</div>

<div class="status" id="status">
Connecting to Firebase...
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyB3V69-7f3sIOqaKnI5qWBXVZ2puYtL-MM",
authDomain: "apna-kaam-731c9.firebaseapp.com",
databaseURL: "https://apna-kaam-731c9-default-rtdb.firebaseio.com",
projectId: "apna-kaam-731c9",
storageBucket: "apna-kaam-731c9.firebasestorage.app",
messagingSenderId: "735847647314",
appId: "1:735847647314:web:ae023a0cd2c97f5659b78b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.sendCommand = function(command){

set(ref(db,"robot/command"),command)
.then(()=>{

document.getElementById("status").innerText =
"Command Sent: " + command;

})
.catch(()=>{
document.getElementById("status").innerText =
"Error sending command!";
});

}

document.getElementById("status").innerText =
"Connected ✅";

</script>

</body>
</html>
